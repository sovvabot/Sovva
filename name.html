<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light" />
  <title>Sovva — Your name</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Inter', sans-serif !important;
    }

    html, body, button, input, select, textarea, h1, h2, h3, p, div, span, a, label {
      font-family: 'Inter', sans-serif !important;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 20px;
      background: #ffffff;
      color: #111827;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 16px;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .brand {
      font-size: 20px;
      font-weight: 700;
      color: #111827;
      letter-spacing: -0.02em;
    }

    h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 700;
      color: #111827;
    }

    p {
      margin: 0;
      font-size: 14px;
      color: #4b5563;
      line-height: 1.5;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      font-size: 13px;
      font-weight: 600;
      color: #374151;
    }

    input {
      width: 100%;
      padding: 11px 12px;
      border-radius: 10px;
      border: 1px solid #d1d5db;
      background: #ffffff;
      color: #111827;
      font-size: 14px;
      outline: none;
    }

    input:focus {
      border-color: #0969da;
    }

    .err {
      color: #dc2626;
      font-size: 13px;
      min-height: 18px;
    }

    button {
      width: 100%;
      padding: 12px 16px;
      border-radius: 10px;
      border: none;
      background: #0969da;
      color: #ffffff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover {
      background: #0550ae;
    }

    .footer {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      text-align: center;
    }

    .footer-links {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 14px;
      font-size: 13px;
    }

    .footer-links a {
      color: #4b5563;
      text-decoration: none;
    }

    .footer-links a:hover {
      color: #111827;
      text-decoration: underline;
    }

    .copyright {
      font-size: 12px;
      color: #6b7280;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">Sovva</div>
    <h1>What is your name?</h1>
    <p>Enter your first name and optionally your last name.</p>

    <div class="field">
      <label for="firstNameInput">First name</label>
      <input id="firstNameInput" type="text" autocomplete="given-name" />
    </div>

    <div class="field">
      <label for="lastNameInput">Last name (optional)</label>
      <input id="lastNameInput" type="text" autocomplete="family-name" />
    </div>

    <div id="errMsg" class="err"></div>
    <button id="nextBtn" type="button">Next</button>
  </main>

  <footer class="footer">
    <nav class="footer-links" aria-label="Footer links">
      <a href="./support.html">Support</a>
      <a href="./terms.html">Terms</a>
      <a href="./privacy.html">Privacy</a>
    </nav>
    <div class="copyright">© 2026 Sovva, All rights reserved</div>
  </footer>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
    import { getAuth } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCzok_zQsToh-OzGUBCK4Omx8IELOU9CC4",
      authDomain: "sovva-e2c64.firebaseapp.com",
      databaseURL: "https://sovva-e2c64-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "sovva-e2c64",
      storageBucket: "sovva-e2c64.firebasestorage.app",
      messagingSenderId: "71366651741",
      appId: "1:71366651741:web:7d26107a41f0291f1f82b4"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const DRAFT_KEY = "sovva_reg_draft";
    const firstNameInput = document.getElementById("firstNameInput");
    const lastNameInput = document.getElementById("lastNameInput");
    const errMsg = document.getElementById("errMsg");
    const nextBtn = document.getElementById("nextBtn");

    function loadDraft() {
      try {
        return JSON.parse(sessionStorage.getItem(DRAFT_KEY) || "{}");
      } catch {
        return {};
      }
    }

    function saveDraft(patch) {
      sessionStorage.setItem(DRAFT_KEY, JSON.stringify({ ...loadDraft(), ...patch }));
    }

    const draft = loadDraft();
    if (draft.firstName) firstNameInput.value = draft.firstName;
    if (draft.lastName) lastNameInput.value = draft.lastName;

    (async () => {
      await auth.authStateReady();
      const user = auth.currentUser;
      if (!user) {
        window.location.replace("./index.html");
        return;
      }

      if (!firstNameInput.value && user.displayName) {
        const parts = user.displayName.trim().split(/\s+/);
        firstNameInput.value = parts[0] || "";
        if (!lastNameInput.value && parts.length > 1) {
          lastNameInput.value = parts.slice(1).join(" ");
        }
      }
    })();

    nextBtn.addEventListener("click", () => {
      const firstName = firstNameInput.value.trim();
      const lastName = lastNameInput.value.trim();
      if (!firstName) {
        errMsg.textContent = "Please enter your first name.";
        firstNameInput.focus();
        return;
      }
      errMsg.textContent = "";
      saveDraft({ firstName, lastName });
      window.location.href = "./otherandgender.html";
    });
  </script>
</body>
</html>
