<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />
  <title>Sovva</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #ffffff;
      --text: #111111;
      --muted: #656d76;
      --border: #d0d7de;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117;
        --text: #f0f6fc;
        --muted: #8b949e;
        --border: #30363d;
      }
    }
    * { box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 24px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    footer {
      margin-top: 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      text-align: center;
    }
    .footer-links {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
    }
    .footer-btn {
      display: inline-block;
      padding: 8px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      text-decoration: none;
      color: inherit;
      font-size: 14px;
      font-weight: 500;
    }
    .copyright {
      margin: 0;
      font-size: 13px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main>
    <h1 id="welcome">Welcome</h1>
  </main>

  <footer>
    <div class="footer-links">
      <a class="footer-btn" href="./terms.html">Условия</a>
      <a class="footer-btn" href="./privacy.html">Конфиденциальность</a>
      <a class="footer-btn" href="./support.html">Поддержка</a>
    </div>
    <p class="copyright">©2026 Sovva. All rights reserved</p>
  </footer>

  <script>
    const translations = {
      ru: "Добро пожаловать",
      en: "Welcome",
      de: "Willkommen",
      uk: "Ласкаво просимо",
      zh: "欢迎",
      pt: "Bem-vindo"
    };
    const shortLang = (navigator.language || "en").toLowerCase().split("-")[0];
    document.documentElement.lang = translations[shortLang] ? shortLang : "en";
    document.getElementById("welcome").textContent = translations[shortLang] || translations.en;
  </script>
</body>
</html>
