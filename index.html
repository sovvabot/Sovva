<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sovva — Вход</title>
  <style>
    :root { --bg:#0d1117; --card:#161b22; --text:#f0f6fc; --muted:#8b949e; --border:#30363d; --accent:#2f81f7; --accent-hover:#58a6ff; --danger:#f85149; }
    * { box-sizing:border-box; font-family:system-ui,-apple-system,sans-serif; }
    body { margin:0; min-height:100vh; padding:20px; background:var(--bg); color:var(--text); display:flex; justify-content:center; align-items:center; }
    .card { width:100%; max-width:420px; background:var(--card); border:1px solid var(--border); border-radius:16px; padding:24px; display:flex; flex-direction:column; gap:14px; text-align:center; }
    .brand { font-size:24px; font-weight:700; letter-spacing:-0.02em; }
    h1 { margin:0; font-size:20px; }
    p { margin:0; font-size:13px; color:var(--muted); line-height:1.5; }
    .btn-google { width:100%; padding:12px 14px; border-radius:10px; border:none; background:var(--accent); color:#fff; font-size:14px; font-weight:600; cursor:pointer; }
    .btn-google:hover { background:var(--accent-hover); }
    .err { color:var(--danger); font-size:13px; min-height:18px; }
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">Sovva</div>
    <h1>Добро пожаловать</h1>
    <p>Войдите с помощью аккаунта Google, чтобы продолжить или создать профиль.</p>
    <div id="errMsg" class="err"></div>
    <button id="googleLoginBtn" type="button" class="btn-google">Войти через Google</button>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
    import {
      getAuth,
      GoogleAuthProvider,
      signInWithRedirect,
      getRedirectResult,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";
    import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCzok_zQsToh-OzGUBCK4Omx8IELOU9CC4",
      authDomain: "sovva-e2c64.firebaseapp.com",
      databaseURL: "https://sovva-e2c64-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "sovva-e2c64",
      storageBucket: "sovva-e2c64.firebasestorage.app",
      messagingSenderId: "71366651741",
      appId: "1:71366651741:web:7d26107a41f0291f1f82b4"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);
    const provider = new GoogleAuthProvider();

    const googleLoginBtn = document.getElementById("googleLoginBtn");
    const errMsg = document.getElementById("errMsg");
    let routingStarted = false;

    async function routeAfterAuth(user) {
      if (!user || routingStarted) return;
      routingStarted = true;

      try {
        const snap = await get(ref(db, `users/${user.uid}`));
        const profile = snap.exists() ? snap.val() : null;

        if (profile && profile.registrationCompleted === true) {
          window.location.replace("./sovva.html");
        } else {
          window.location.replace("./name.html");
        }
      } catch (e) {
        routingStarted = false;
        errMsg.textContent = e?.message || "Ошибка при проверке профиля.";
      }
    }

    getRedirectResult(auth)
      .then((res) => {
        if (res?.user) {
          routeAfterAuth(res.user);
        }
      })
      .catch((err) => {
        errMsg.textContent = err?.message || "Ошибка входа через Google.";
      });

    onAuthStateChanged(auth, (user) => {
      if (user) {
        routeAfterAuth(user);
      }
    });

    googleLoginBtn.addEventListener("click", async () => {
      errMsg.textContent = "";
      try {
        await signInWithRedirect(auth, provider);
      } catch (err) {
        errMsg.textContent = err?.message || "Не удалось запустить вход через Google.";
      }
    });
  </script>
</body>
</html>
