<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light" />
  <title>Sovva — Вход</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 20px;
      background: #f6f8fa;
      color: #111827;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: #ffffff;
      border: 1px solid #d0d7de;
      border-radius: 16px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      text-align: center;
      box-shadow: 0 8px 24px rgba(17, 24, 39, 0.06);
    }

    .brand {
      font-size: 22px;
      font-weight: 700;
      color: #111827;
      letter-spacing: -0.02em;
    }

    h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 700;
      color: #111827;
    }

    p {
      margin: 0;
      font-size: 14px;
      color: #57606a;
      line-height: 1.5;
    }

    .btn-google {
      width: 100%;
      padding: 12px 16px;
      border-radius: 10px;
      border: 1px solid #d0d7de;
      background: #0969da;
      color: #ffffff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .btn-google:hover {
      background: #0550ae;
    }

    .err {
      color: #cf222e;
      font-size: 13px;
      min-height: 18px;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">Sovva</div>
    <h1>Добро пожаловать</h1>
    <p>Войдите через Google аккаунт, чтобы продолжить или создать профиль.</p>
    <div id="errMsg" class="err"></div>
    <button id="googleLoginBtn" type="button" class="btn-google">
      <span>Войти через Google</span>
    </button>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
    import {
      getAuth,
      GoogleAuthProvider,
      signInWithRedirect,
      getRedirectResult,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";
    import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCzok_zQsToh-OzGUBCK4Omx8IELOU9CC4",
      authDomain: "sovva-e2c64.firebaseapp.com",
      databaseURL: "https://sovva-e2c64-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "sovva-e2c64",
      storageBucket: "sovva-e2c64.firebasestorage.app",
      messagingSenderId: "71366651741",
      appId: "1:71366651741:web:7d26107a41f0291f1f82b4"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);
    const provider = new GoogleAuthProvider();

    const googleLoginBtn = document.getElementById("googleLoginBtn");
    const errMsg = document.getElementById("errMsg");
    let routingStarted = false;

    async function routeAfterAuth(user) {
      if (!user || routingStarted) return;
      routingStarted = true;

      try {
        const snap = await get(ref(db, `users/${user.uid}`));
        const profile = snap.exists() ? snap.val() : null;

        if (profile && profile.registrationCompleted === true) {
          window.location.replace("./sovva.html");
        } else {
          window.location.replace("./name.html");
        }
      } catch (e) {
        routingStarted = false;
        errMsg.textContent = e?.message || "Ошибка при проверке профиля.";
      }
    }

    getRedirectResult(auth)
      .then((res) => {
        if (res?.user) {
          routeAfterAuth(res.user);
        }
      })
      .catch((err) => {
        errMsg.textContent = err?.message || "Ошибка входа через Google.";
      });

    onAuthStateChanged(auth, (user) => {
      if (user) {
        routeAfterAuth(user);
      }
    });

    googleLoginBtn.addEventListener("click", async () => {
      errMsg.textContent = "";
      try {
        await signInWithRedirect(auth, provider);
      } catch (err) {
        errMsg.textContent = err?.message || "Не удалось запустить вход через Google.";
      }
    });
  </script>
</body>
</html>
