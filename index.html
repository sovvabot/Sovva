<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sovva</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      margin: 0;
      padding: 24px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    footer {
      margin-top: 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      text-align: center;
    }

    .footer-links {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
    }

    .footer-btn {
      display: inline-block;
      padding: 8px 14px;
      border: 1px solid #d0d7de;
      border-radius: 8px;
      text-decoration: none;
      color: inherit;
      font-size: 14px;
      font-weight: 500;
    }

    .footer-btn:hover {
      background-color: rgba(0, 0, 0, 0.05);
    }

    .copyright {
      margin: 0;
      font-size: 13px;
      color: #656d76;
    }
  </style>
</head>
<body>
  <main>
    <h1 id="welcome">Welcome</h1>
  </main>

  <footer>
    <div class="footer-links">
      <a class="footer-btn" href="./legal.html#terms">Условия</a>
      <a class="footer-btn" href="./legal.html#privacy">Конфиденциальность</a>
      <a class="footer-btn" href="./legal.html#support">Поддержка</a>
    </div>
    <p class="copyright">©2026 Sovva. All rights reserved</p>
  </footer>

  <script>
    const translations = {
      ru: "Добро пожаловать",
      en: "Welcome",
      de: "Willkommen",
      uk: "Ласкаво просимо",
      zh: "欢迎",
      pt: "Bem-vindo"
    };

    const userLang = (navigator.language || navigator.userLanguage || "en").toLowerCase();
    const shortLang = userLang.split("-")[0];

    const selectedText = translations[shortLang] || translations.en;
    document.documentElement.lang = translations[shortLang] ? shortLang : "en";
    document.getElementById("welcome").textContent = selectedText;
  </script>
</body>
</html>
