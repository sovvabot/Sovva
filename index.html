<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />
  <title>Sovva</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #ffffff;
      --text: #111111;
      --muted: #656d76;
      --border: #d0d7de;
      --btn-bg: #111111;
      --btn-text: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117;
        --text: #f0f6fc;
        --muted: #8b949e;
        --border: #30363d;
        --btn-bg: #f0f6fc;
        --btn-text: #0d1117;
      }
    }
    * { box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 24px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    main {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 16px;
    }
    h1 {
      margin: 0;
    }
    .google-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 10px 18px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background-color: var(--btn-bg);
      color: var(--btn-text);
      font-family: inherit;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
    .logout-btn {
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text);
      font-family: inherit;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
    }
    .user-box {
      display: none;
      flex-direction: column;
      align-items: flex-start;
      gap: 10px;
      padding: 14px 16px;
      border: 1px solid var(--border);
      border-radius: 12px;
    }
    .user-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      object-fit: cover;
    }
    .user-email {
      font-size: 13px;
      color: var(--muted);
    }
    .status-text {
      font-size: 13px;
      color: var(--muted);
      margin: 0;
      white-space: pre-line;
    }
    footer {
      margin-top: 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      text-align: center;
    }
    .footer-links {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
    }
    .footer-btn {
      display: inline-block;
      padding: 8px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      text-decoration: none;
      color: inherit;
      font-size: 14px;
      font-weight: 500;
    }
    .copyright {
      margin: 0;
      font-size: 13px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main>
    <h1 id="welcome">Welcome</h1>

    <button id="loginBtn" class="google-btn" type="button">
      <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
        <path fill="#4285F4" d="M23.49 12.27c0-.79-.07-1.54-.19-2.27H12v4.51h6.47c-.29 1.48-1.14 2.73-2.4 3.58v3h3.86c2.26-2.09 3.56-5.17 3.56-8.82z"/>
        <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.86-3c-1.08.72-2.45 1.16-4.07 1.16-3.13 0-5.78-2.11-6.73-4.96H1.29v3.09C3.26 21.3 7.31 24 12 24z"/>
        <path fill="#FBBC05" d="M5.27 14.29c-.25-.72-.38-1.49-.38-2.29s.14-1.57.38-2.29V6.62H1.29C.47 8.24 0 10.06 0 12s.47 3.76 1.29 5.38l3.98-3.09z"/>
        <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.31 0 3.26 2.7 1.29 6.62l3.98 3.09c.95-2.85 3.6-4.96 6.73-4.96z"/>
      </svg>
      <span>Войти через Google</span>
    </button>

    <div id="userBox" class="user-box">
      <div class="user-row">
        <img id="userPhoto" class="avatar" src="" alt="" />
        <div>
          <div id="userName"></div>
          <div id="userEmail" class="user-email"></div>
        </div>
      </div>
      <button id="logoutBtn" class="logout-btn" type="button">Выйти</button>
    </div>

    <p id="dbCounter" class="status-text">Участников в базе: ...</p>
    <p id="onlineCounter" class="status-text">Онлайн: ...</p>
    <p id="statusText" class="status-text"></p>
  </main>

  <footer>
    <div class="footer-links">
      <a class="footer-btn" href="./terms.html">Условия</a>
      <a class="footer-btn" href="./privacy.html">Конфиденциальность</a>
      <a class="footer-btn" href="./support.html">Поддержка</a>
    </div>
    <p class="copyright">©2026 Sovva. All rights reserved</p>
  </footer>

  <script>
    const translations = {
      ru: "Добро пожаловать",
      en: "Welcome",
      de: "Willkommen",
      uk: "Ласкаво просимо",
      zh: "欢迎",
      pt: "Bem-vindo"
    };
    const shortLang = (navigator.language || "en").toLowerCase().split("-")[0];
    document.documentElement.lang = translations[shortLang] ? shortLang : "en";
    document.getElementById("welcome").textContent = translations[shortLang] || translations.en;
  </script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
    import {
      getAuth,
      GoogleAuthProvider,
      signInWithPopup,
      signOut,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";
    import {
      getDatabase,
      ref,
      update,
      get,
      set,
      remove,
      onValue,
      onDisconnect,
      runTransaction,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD7tFnceBt_C8OnhVjfnHlXluW93FZVx7c",
      authDomain: "sovva-dfa44.firebaseapp.com",
      databaseURL: "https://sovva-dfa44-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "sovva-dfa44",
      storageBucket: "sovva-dfa44.firebasestorage.app",
      messagingSenderId: "907823494969",
      appId: "1:907823494969:web:88ff2979a51d01f0905ae8"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);
    const provider = new GoogleAuthProvider();

    const loginBtn = document.getElementById("loginBtn");
    const logoutBtn = document.getElementById("logoutBtn");
    const userBox = document.getElementById("userBox");
    const userPhoto = document.getElementById("userPhoto");
    const userName = document.getElementById("userName");
    const userEmail = document.getElementById("userEmail");
    const dbCounter = document.getElementById("dbCounter");
    const onlineCounter = document.getElementById("onlineCounter");
    const statusText = document.getElementById("statusText");

    let isRedirectingToAuth = false;

    function getWaitTimeText() {
      const mins = Math.floor(Math.random() * (120 - 15 + 1)) + 15;
      if (mins < 60) return `${mins} мин`;
      const h = Math.floor(mins / 60);
      const m = mins % 60;
      return m > 0 ? `${h} ч ${m} мин` : `${h} ч`;
    }

    async function adjustCounter(path, delta) {
      const counterRef = ref(db, path);
      await runTransaction(counterRef, (current) => {
        const val = typeof current === "number" ? current : 0;
        const next = val + delta;
        return next < 0 ? 0 : next;
      });
    }

    onValue(ref(db, "meta/usersCount"), (snap) => {
      const val = snap.val();
      dbCounter.textContent = "Участников в базе: " + (typeof val === "number" ? val : 0);
    }, (err) => {
      dbCounter.textContent = "Счётчик базы: " + err.code;
    });

    onValue(ref(db, "meta/onlineCount"), (snap) => {
      const val = snap.val();
      onlineCounter.textContent = "Онлайн: " + (typeof val === "number" ? val : 0);
    }, (err) => {
      onlineCounter.textContent = "Счётчик онлайн: " + err.code;
    });

    // Пишем в users ТОЛЬКО если пользователь уже завершил регистрацию на auth.html
    async function touchRegisteredUser(user) {
      const userRef = ref(db, "users/" + user.uid);
      const snap = await get(userRef);
      if (!snap.exists()) return null;

      const data = snap.val();
      if (!data.registrationCompleted) return data;

      await update(userRef, {
        email: user.email || data.email || "",
        photo: user.photoURL || data.photo || "",
        lastLogin: serverTimestamp()
      });

      return data;
    }

    async function enterOnline(user) {
      const myOnlineRef = ref(db, "online/" + user.uid);
      const existing = await get(myOnlineRef);
      const wasOnline = existing.exists();

      await set(myOnlineRef, {
        name: user.displayName || "Пользователь",
        joinedAt: serverTimestamp()
      });

      if (!wasOnline) {
        await adjustCounter("meta/onlineCount", 1);
      }

      onDisconnect(myOnlineRef).remove();
    }

    async function leaveOnline(uid) {
      const myOnlineRef = ref(db, "online/" + uid);
      const existing = await get(myOnlineRef);
      if (existing.exists()) {
        await remove(myOnlineRef);
        await adjustCounter("meta/onlineCount", -1);
      }
    }

    loginBtn.addEventListener("click", async () => {
      statusText.textContent = "Открываем окно Google...";
      try {
        await signInWithPopup(auth, provider);
        statusText.textContent = "";
      } catch (err) {
        statusText.textContent = "Ошибка входа: " + err.code;
      }
    });

    logoutBtn.addEventListener("click", async () => {
      try {
        if (auth.currentUser) {
          await leaveOnline(auth.currentUser.uid);
        }
        await signOut(auth);
        statusText.textContent = "Вы вышли из аккаунта";
      } catch (err) {
        statusText.textContent = "Ошибка выхода: " + err.code;
      }
    });

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        loginBtn.style.display = "none";
        userBox.style.display = "flex";
        userName.textContent = user.displayName || "Пользователь";
        userEmail.textContent = user.email || "";
        userPhoto.src = user.photoURL || "";
        userPhoto.style.display = user.photoURL ? "block" : "none";

        try {
          const profile = await touchRegisteredUser(user);
          await enterOnline(user);
          statusText.textContent = "";

          const isRegistered = Boolean(
            profile && profile.registrationCompleted && profile.firstName && profile.birthDate
          );

          if (!isRegistered && !isRedirectingToAuth) {
            isRedirectingToAuth = true;
            window.location.href = "./auth.html";
          }
        } catch (err) {
          if (err.code === "PERMISSION_DENIED") {
            statusText.textContent =
              `Упс!!! Кажется, онлайн базы в реальном времени сейчас недоступен.\n` +
              `Подождите, когда база в реальном времени обновится через ${getWaitTimeText()} — сервер сбросится с нуля, и можно будет заходить снова.`;
          } else {
            statusText.textContent = "Ошибка базы: " + err.code;
          }
        }
      } else {
        loginBtn.style.display = "inline-flex";
        userBox.style.display = "none";
      }
    });
  </script>
</body>
</html>
