<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light" />
  <title>Sovva — Sign in</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Inter', sans-serif !important;
    }

    html, body, button, input, select, textarea, h1, h2, h3, p, div, span, a {
      font-family: 'Inter', sans-serif !important;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 20px;
      background: #ffffff;
      color: #111827;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 16px;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      text-align: center;
    }

    .brand {
      font-size: 22px;
      font-weight: 700;
      color: #111827;
      letter-spacing: -0.02em;
    }

    h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 700;
      color: #111827;
    }

    p {
      margin: 0;
      font-size: 14px;
      color: #4b5563;
      line-height: 1.5;
    }

    .btn-google {
      width: 100%;
      padding: 12px 16px;
      border-radius: 10px;
      border: 1px solid #d1d5db;
      background: #0969da;
      color: #ffffff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .btn-google:hover {
      background: #0550ae;
    }

    .btn-google:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .err {
      color: #dc2626;
      font-size: 13px;
      min-height: 18px;
    }

    .footer {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      text-align: center;
    }

    .footer-links {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 14px;
      font-size: 13px;
    }

    .footer-links a {
      color: #4b5563;
      text-decoration: none;
    }

    .footer-links a:hover {
      color: #111827;
      text-decoration: underline;
    }

    .copyright {
      font-size: 12px;
      color: #6b7280;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">Sovva</div>
    <h1>Welcome</h1>
    <p>Sign in with your Google account to continue or create your profile.</p>
    <div id="errMsg" class="err"></div>
    <button id="googleLoginBtn" type="button" class="btn-google">
      <span>Continue with Google</span>
    </button>
  </main>

  <footer class="footer">
    <nav class="footer-links" aria-label="Footer links">
      <a href="./support.html">Support</a>
      <a href="./terms.html">Terms</a>
      <a href="./privacy.html">Privacy</a>
    </nav>
    <div class="copyright">© 2026 Sovva, All rights reserved</div>
  </footer>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
    import {
      getAuth,
      GoogleAuthProvider,
      signInWithRedirect,
      getRedirectResult,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";
    import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCzok_zQsToh-OzGUBCK4Omx8IELOU9CC4",
      authDomain: "sovva-e2c64.firebaseapp.com",
      databaseURL: "https://sovva-e2c64-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "sovva-e2c64",
      storageBucket: "sovva-e2c64.firebasestorage.app",
      messagingSenderId: "71366651741",
      appId: "1:71366651741:web:7d26107a41f0291f1f82b4"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);
    const provider = new GoogleAuthProvider();

    const googleLoginBtn = document.getElementById("googleLoginBtn");
    const errMsg = document.getElementById("errMsg");
    let routingStarted = false;

    async function routeAfterAuth(user) {
      if (!user || routingStarted) return;
      routingStarted = true;
      googleLoginBtn.disabled = true;

      try {
        const snap = await get(ref(db, `users/${user.uid}`));
        const profile = snap.exists() ? snap.val() : null;

        if (profile && profile.registrationCompleted === true) {
          window.location.replace("./sovva.html");
        } else {
          window.location.replace("./name.html");
        }
      } catch (e) {
        routingStarted = false;
        googleLoginBtn.disabled = false;
        errMsg.textContent = e?.message || "Failed to check profile.";
      }
    }

    getRedirectResult(auth)
      .then((res) => {
        if (res?.user) {
          routeAfterAuth(res.user);
        }
      })
      .catch((err) => {
        errMsg.textContent = err?.message || "Google sign-in error.";
      });

    onAuthStateChanged(auth, (user) => {
      if (user) {
        routeAfterAuth(user);
      }
    });

    googleLoginBtn.addEventListener("click", async () => {
      errMsg.textContent = "";
      googleLoginBtn.disabled = true;
      try {
        await signInWithRedirect(auth, provider);
      } catch (err) {
        googleLoginBtn.disabled = false;
        errMsg.textContent = err?.message || "Could not start Google sign-in.";
      }
    });
  </script>
</body>
</html>
