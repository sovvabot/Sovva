<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />
  <title>Sovva</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #ffffff;
      --text: #111111;
      --muted: #656d76;
      --border: #d0d7de;
      --btn-bg: #111111;
      --btn-text: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117;
        --text: #f0f6fc;
        --muted: #8b949e;
        --border: #30363d;
        --btn-bg: #f0f6fc;
        --btn-text: #0d1117;
      }
    }
    * { box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 24px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    main {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 16px;
    }
    h1 {
      margin: 0;
    }
    .google-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 10px 18px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background-color: var(--btn-bg);
      color: var(--btn-text);
      font-family: inherit;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
    .status-text {
      font-size: 13px;
      color: var(--muted);
      margin: 0;
      white-space: pre-line;
    }
    footer {
      margin-top: 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      text-align: center;
    }
    .footer-links {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
    }
    .footer-btn {
      display: inline-block;
      padding: 8px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      text-decoration: none;
      color: inherit;
      font-size: 14px;
      font-weight: 500;
    }
    .copyright {
      margin: 0;
      font-size: 13px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main>
    <h1 id="welcome">Welcome</h1>

    <button id="loginBtn" class="google-btn" type="button">
      <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
        <path fill="#4285F4" d="M23.49 12.27c0-.79-.07-1.54-.19-2.27H12v4.51h6.47c-.29 1.48-1.14 2.73-2.4 3.58v3h3.86c2.26-2.09 3.56-5.17 3.56-8.82z"/>
        <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.86-3c-1.08.72-2.45 1.16-4.07 1.16-3.13 0-5.78-2.11-6.73-4.96H1.29v3.09C3.26 21.3 7.31 24 12 24z"/>
        <path fill="#FBBC05" d="M5.27 14.29c-.25-.72-.38-1.49-.38-2.29s.14-1.57.38-2.29V6.62H1.29C.47 8.24 0 10.06 0 12s.47 3.76 1.29 5.38l3.98-3.09z"/>
        <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.31 0 3.26 2.7 1.29 6.62l3.98 3.09c.95-2.85 3.6-4.96 6.73-4.96z"/>
      </svg>
      <span>Войти через Google</span>
    </button>

    <p id="statusText" class="status-text"></p>
  </main>

  <footer>
    <div class="footer-links">
      <a class="footer-btn" href="./terms.html">Условия</a>
      <a class="footer-btn" href="./privacy.html">Конфиденциальность</a>
      <a class="footer-btn" href="./support.html">Поддержка</a>
    </div>
    <p class="copyright">©2026 Sovva. All rights reserved</p>
  </footer>

  <script>
    const translations = {
      ru: "Добро пожаловать",
      en: "Welcome",
      de: "Willkommen",
      uk: "Ласкаво просимо",
      zh: "欢迎",
      pt: "Bem-vindo"
    };
    const shortLang = (navigator.language || "en").toLowerCase().split("-")[0];
    document.documentElement.lang = translations[shortLang] ? shortLang : "en";
    document.getElementById("welcome").textContent = translations[shortLang] || translations.en;
  </script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
    import {
      getAuth,
      GoogleAuthProvider,
      signInWithPopup,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";
    import {
      getDatabase,
      ref,
      get
    } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCzok_zQsToh-OzGUBCK4Omx8IELOU9CC4",
      authDomain: "sovva-e2c64.firebaseapp.com",
      databaseURL: "https://sovva-e2c64-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "sovva-e2c64",
      storageBucket: "sovva-e2c64.firebasestorage.app",
      messagingSenderId: "71366651741",
      appId: "1:71366651741:web:7d26107a41f0291f1f82b4"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);
    const provider = new GoogleAuthProvider();
    provider.setCustomParameters({ prompt: "select_account" });

    const loginBtn = document.getElementById("loginBtn");
    const statusText = document.getElementById("statusText");
    let isRedirecting = false;

    function getWaitTimeText() {
      const mins = Math.floor(Math.random() * (120 - 15 + 1)) + 15;
      if (mins < 60) return `${mins} мин`;
      const h = Math.floor(mins / 60);
      const m = mins % 60;
      return m > 0 ? `${h} ч ${m} мин` : `${h} ч`;
    }

    async function routeUser(user) {
      if (isRedirecting) return;
      const snap = await get(ref(db, "users/" + user.uid));
      const profile = snap.exists() ? snap.val() : null;

      const isRegistered = Boolean(
        profile &&
        profile.registrationCompleted === true &&
        typeof profile.firstName === "string" &&
        profile.firstName.trim().length > 0 &&
        typeof profile.birthDate === "string" &&
        profile.birthDate.trim().length > 0
      );

      isRedirecting = true;
      if (!isRegistered) {
        window.location.replace("./auth.html");
      } else if (profile.hasPassword === true && profile.passwordHash) {
        window.location.replace("./auth.html?mode=login");
      } else {
        window.location.replace("./sovva.html");
      }
    }

    loginBtn.addEventListener("click", async () => {
      statusText.textContent = "Открываем окно Google...";
      try {
        const result = await signInWithPopup(auth, provider);
        await routeUser(result.user);
      } catch (err) {
        statusText.textContent = "Ошибка входа: " + err.code;
      }
    });

    onAuthStateChanged(auth, async (user) => {
      if (!user) return;
      try {
        await routeUser(user);
      } catch (err) {
        if (err.code === "PERMISSION_DENIED") {
          statusText.textContent =
            `Упс!!! Кажется, онлайн базы в реальном времени сейчас недоступен.\n` +
            `Подождите, когда база в реальном времени обновится через ${getWaitTimeText()} — сервер сбросится с нуля, и можно будет заходить снова.`;
        } else {
          statusText.textContent = "Ошибка базы: " + err.code;
        }
      }
    });
  </script>
</body>
</html>
