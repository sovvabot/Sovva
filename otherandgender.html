<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light" />
  <title>Sovva — Birth date & gender</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Inter', sans-serif !important;
    }

    html, body, button, input, select, textarea, h1, h2, h3, p, div, span, a, label {
      font-family: 'Inter', sans-serif !important;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 20px;
      background: #ffffff;
      color: #111827;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 16px;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .brand {
      font-size: 20px;
      font-weight: 700;
      color: #111827;
      letter-spacing: -0.02em;
    }

    h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 700;
      color: #111827;
    }

    p {
      margin: 0;
      font-size: 14px;
      color: #4b5563;
      line-height: 1.5;
    }

    label.field-label {
      font-size: 13px;
      font-weight: 600;
      color: #374151;
      display: block;
      margin-bottom: 6px;
    }

    select {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid #d1d5db;
      background: #ffffff;
      color: #111827;
      font-size: 14px;
      outline: none;
    }

    select:focus {
      border-color: #0969da;
    }

    .date-row {
      display: grid;
      grid-template-columns: 1fr 1.4fr 1.1fr;
      gap: 8px;
    }

    .gender-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .gender-opt {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 9px 10px;
      border-radius: 10px;
      border: 1px solid #d1d5db;
      background: #ffffff;
      color: #111827;
      font-size: 13px;
      cursor: pointer;
    }

    .err {
      color: #dc2626;
      font-size: 13px;
      min-height: 18px;
    }

    .row-btns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    button {
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-primary {
      border: none;
      background: #0969da;
      color: #ffffff;
    }

    .btn-primary:hover {
      background: #0550ae;
    }

    .btn-secondary {
      border: 1px solid #d1d5db;
      background: #ffffff;
      color: #111827;
    }

    .btn-secondary:hover {
      background: #f9fafb;
    }

    .footer {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      text-align: center;
    }

    .footer-links {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 14px;
      font-size: 13px;
    }

    .footer-links a {
      color: #4b5563;
      text-decoration: none;
    }

    .footer-links a:hover {
      color: #111827;
      text-decoration: underline;
    }

    .copyright {
      font-size: 12px;
      color: #6b7280;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">Sovva</div>
    <h1>Birth date and gender</h1>
    <p>Select your date of birth and choose your gender.</p>

    <div>
      <label class="field-label">Date of birth</label>
      <div class="date-row">
        <select id="birthDay"></select>
        <select id="birthMonth"></select>
        <select id="birthYear"></select>
      </div>
    </div>

    <div>
      <label class="field-label">Gender</label>
      <div class="gender-grid">
        <label class="gender-opt"><input type="radio" name="gender" value="male" />Male</label>
        <label class="gender-opt"><input type="radio" name="gender" value="female" />Female</label>
        <label class="gender-opt"><input type="radio" name="gender" value="none" checked />Not specified</label>
      </div>
    </div>

    <div id="errMsg" class="err"></div>
    <div class="row-btns">
      <button id="backBtn" type="button" class="btn-secondary">Back</button>
      <button id="nextBtn" type="button" class="btn-primary">Next</button>
    </div>
  </main>

  <footer class="footer">
    <nav class="footer-links" aria-label="Footer links">
      <a href="./support.html">Support</a>
      <a href="./terms.html">Terms</a>
      <a href="./privacy.html">Privacy</a>
    </nav>
    <div class="copyright">© 2026 Sovva, All rights reserved</div>
  </footer>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
    import { getAuth } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCzok_zQsToh-OzGUBCK4Omx8IELOU9CC4",
      authDomain: "sovva-e2c64.firebaseapp.com",
      databaseURL: "https://sovva-e2c64-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "sovva-e2c64",
      storageBucket: "sovva-e2c64.firebasestorage.app",
      messagingSenderId: "71366651741",
      appId: "1:71366651741:web:7d26107a41f0291f1f82b4"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const DRAFT_KEY = "sovva_reg_draft";
    const months = ["January","February","March","April","May","June","July","August","September","October","November","December"];
    const birthDay = document.getElementById("birthDay");
    const birthMonth = document.getElementById("birthMonth");
    const birthYear = document.getElementById("birthYear");
    const errMsg = document.getElementById("errMsg");
    const backBtn = document.getElementById("backBtn");
    const nextBtn = document.getElementById("nextBtn");

    function initSelects() {
      birthDay.innerHTML = `<option value="">DD</option>`;
      for (let d = 1; d <= 31; d++) {
        const v = String(d).padStart(2, "0");
        birthDay.innerHTML += `<option value="${v}">${v}</option>`;
      }
      birthMonth.innerHTML = `<option value="">Month</option>`;
      months.forEach((name, idx) => {
        const v = String(idx + 1).padStart(2, "0");
        birthMonth.innerHTML += `<option value="${v}">${name}</option>`;
      });
      const nowY = new Date().getFullYear();
      birthYear.innerHTML = `<option value="">Year</option>`;
      for (let y = nowY - 5; y >= 1925; y--) {
        birthYear.innerHTML += `<option value="${y}">${y}</option>`;
      }
    }

    function loadDraft() {
      try { return JSON.parse(sessionStorage.getItem(DRAFT_KEY) || "{}"); } catch { return {}; }
    }

    function saveDraft(patch) {
      sessionStorage.setItem(DRAFT_KEY, JSON.stringify({ ...loadDraft(), ...patch }));
    }

    initSelects();
    const draft = loadDraft();
    if (!draft.firstName) {
      window.location.replace("./name.html");
    }
    if (draft.birthDate && /^\d{4}-\d{2}-\d{2}$/.test(draft.birthDate)) {
      const [y, m, d] = draft.birthDate.split("-");
      birthYear.value = y;
      birthMonth.value = m;
      birthDay.value = d;
    }
    if (draft.gender) {
      const r = document.querySelector(`input[name="gender"][value="${draft.gender}"]`);
      if (r) r.checked = true;
    }

    (async () => {
      await auth.authStateReady();
      if (!auth.currentUser) {
        window.location.replace("./index.html");
      }
    })();

    backBtn.addEventListener("click", () => {
      window.location.href = "./name.html";
    });

    nextBtn.addEventListener("click", () => {
      const d = birthDay.value;
      const m = birthMonth.value;
      const y = birthYear.value;
      if (!d || !m || !y) {
        errMsg.textContent = "Please select a valid date of birth.";
        return;
      }
      const check = new Date(Number(y), Number(m) - 1, Number(d));
      if (check.getFullYear() !== Number(y) || check.getMonth() !== Number(m) - 1 || check.getDate() !== Number(d)) {
        errMsg.textContent = "Please select a valid date of birth.";
        return;
      }
      const genderEl = document.querySelector('input[name="gender"]:checked');
      saveDraft({
        birthDate: `${y}-${m}-${d}`,
        gender: genderEl ? genderEl.value : "none"
      });
      errMsg.textContent = "";
      window.location.href = "./password.html";
    });
  </script>
</body>
</html>
