<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sovva — Дата рождения и пол</title>
  <style>
    :root { --bg:#0d1117; --card:#161b22; --text:#f0f6fc; --muted:#8b949e; --border:#30363d; --accent:#2f81f7; --danger:#f85149; }
    * { box-sizing:border-box; font-family:system-ui,-apple-system,sans-serif; }
    body { margin:0; min-height:100vh; padding:20px; background:var(--bg); color:var(--text); display:flex; justify-content:center; align-items:flex-start; }
    .card { width:100%; max-width:440px; background:var(--card); border:1px solid var(--border); border-radius:16px; padding:20px; display:flex; flex-direction:column; gap:14px; }
    h1 { margin:0; font-size:20px; }
    p { margin:0; font-size:13px; color:var(--muted); line-height:1.45; }
    label { font-size:13px; font-weight:600; color:var(--muted); display:block; margin-bottom:6px; }
    select { padding:10px 12px; border-radius:10px; border:1px solid var(--border); background:var(--bg); color:var(--text); font-size:14px; }
    .date-row { display:grid; grid-template-columns:1fr 1.4fr 1.1fr; gap:8px; }
    .gender-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
    .gender-opt { display:flex; align-items:center; gap:6px; padding:8px 10px; border-radius:10px; border:1px solid var(--border); background:var(--bg); font-size:13px; cursor:pointer; }
    .err { color:var(--danger); font-size:13px; min-height:18px; }
    .row-btns { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    button { padding:11px 14px; border-radius:10px; font-size:14px; font-weight:600; cursor:pointer; }
    .btn-primary { border:none; background:var(--accent); color:#fff; }
    .btn-secondary { border:1px solid var(--border); background:transparent; color:var(--text); }
  </style>
</head>
<body>
  <main class="card">
    <h1>Дата рождения и пол</h1>
    <p>Выберите дату рождения и укажите пол.</p>

    <div>
      <label>Дата рождения</label>
      <div class="date-row">
        <select id="birthDay"></select>
        <select id="birthMonth"></select>
        <select id="birthYear"></select>
      </div>
    </div>

    <div>
      <label>Пол</label>
      <div class="gender-grid">
        <label class="gender-opt"><input type="radio" name="gender" value="male" />Мужской</label>
        <label class="gender-opt"><input type="radio" name="gender" value="female" />Женский</label>
        <label class="gender-opt"><input type="radio" name="gender" value="none" checked />Не указан</label>
      </div>
    </div>

    <div id="errMsg" class="err"></div>
    <div class="row-btns">
      <button id="backBtn" type="button" class="btn-secondary">Назад</button>
      <button id="nextBtn" type="button" class="btn-primary">Далее</button>
    </div>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCzok_zQsToh-OzGUBCK4Omx8IELOU9CC4",
      authDomain: "sovva-e2c64.firebaseapp.com",
      databaseURL: "https://sovva-e2c64-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "sovva-e2c64",
      storageBucket: "sovva-e2c64.firebasestorage.app",
      messagingSenderId: "71366651741",
      appId: "1:71366651741:web:7d26107a41f0291f1f82b4"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const DRAFT_KEY = "sovva_reg_draft";
    const months = ["Январь","Февраль","Март","Апрель","Май","Июнь","Июль","Август","Сентябрь","Октябрь","Ноябрь","Декабрь"];
    const birthDay = document.getElementById("birthDay");
    const birthMonth = document.getElementById("birthMonth");
    const birthYear = document.getElementById("birthYear");
    const errMsg = document.getElementById("errMsg");
    const backBtn = document.getElementById("backBtn");
    const nextBtn = document.getElementById("nextBtn");

    function initSelects() {
      birthDay.innerHTML = `<option value="">ДД</option>`;
      for (let d = 1; d <= 31; d++) {
        const v = String(d).padStart(2, "0");
        birthDay.innerHTML += `<option value="${v}">${v}</option>`;
      }
      birthMonth.innerHTML = `<option value="">Месяц</option>`;
      months.forEach((name, idx) => {
        const v = String(idx + 1).padStart(2, "0");
        birthMonth.innerHTML += `<option value="${v}">${name}</option>`;
      });
      const nowY = new Date().getFullYear();
      birthYear.innerHTML = `<option value="">Год</option>`;
      for (let y = nowY - 5; y >= 1925; y--) {
        birthYear.innerHTML += `<option value="${y}">${y}</option>`;
      }
    }

    function loadDraft() {
      try { return JSON.parse(sessionStorage.getItem(DRAFT_KEY) || "{}"); } catch { return {}; }
    }

    function saveDraft(patch) {
      sessionStorage.setItem(DRAFT_KEY, JSON.stringify({ ...loadDraft(), ...patch }));
    }

    initSelects();
    const draft = loadDraft();
    if (!draft.firstName) {
      window.location.replace("./name.html");
    }
    if (draft.birthDate && /^\d{4}-\d{2}-\d{2}$/.test(draft.birthDate)) {
      const [y, m, d] = draft.birthDate.split("-");
      birthYear.value = y;
      birthMonth.value = m;
      birthDay.value = d;
    }
    if (draft.gender) {
      const r = document.querySelector(`input[name="gender"][value="${draft.gender}"]`);
      if (r) r.checked = true;
    }

    onAuthStateChanged(auth, (user) => {
      if (!user) window.location.replace("./index.html");
    });

    backBtn.addEventListener("click", () => {
      window.location.href = "./name.html";
    });

    nextBtn.addEventListener("click", () => {
      const d = birthDay.value;
      const m = birthMonth.value;
      const y = birthYear.value;
      if (!d || !m || !y) {
        errMsg.textContent = "Выберите корректную дату рождения.";
        return;
      }
      const check = new Date(Number(y), Number(m) - 1, Number(d));
      if (check.getFullYear() !== Number(y) || check.getMonth() !== Number(m) - 1 || check.getDate() !== Number(d)) {
        errMsg.textContent = "Выберите корректную дату рождения.";
        return;
      }
      const genderEl = document.querySelector('input[name="gender"]:checked');
      saveDraft({
        birthDate: `${y}-${m}-${d}`,
        gender: genderEl ? genderEl.value : "none"
      });
      errMsg.textContent = "";
      window.location.href = "./password.html";
    });
  </script>
</body>
</html>
