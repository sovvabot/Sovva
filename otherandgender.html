<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light" />
  <title>Sovva — Пароль</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Inter', sans-serif !important;
    }

    html, body, button, input, select, textarea, h1, h2, h3, p, div, span, a, label {
      font-family: 'Inter', sans-serif !important;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 20px;
      background: #ffffff;
      color: #111827;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 16px;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .brand {
      font-size: 20px;
      font-weight: 700;
      color: #111827;
      letter-spacing: -0.02em;
    }

    h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 700;
      color: #111827;
    }

    p {
      margin: 0;
      font-size: 14px;
      color: #4b5563;
      line-height: 1.5;
    }

    label {
      font-size: 13px;
      font-weight: 600;
      color: #374151;
      display: block;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      padding: 11px 12px;
      border-radius: 10px;
      border: 1px solid #d1d5db;
      background: #ffffff;
      color: #111827;
      font-size: 14px;
      outline: none;
    }

    input:focus {
      border-color: #0969da;
    }

    .bar-bg {
      width: 100%;
      height: 6px;
      border-radius: 999px;
      background: #e5e7eb;
      overflow: hidden;
      margin-top: 8px;
    }

    .bar-fill {
      width: 0%;
      height: 100%;
      background: #dc2626;
      transition: width .2s ease, background-color .2s ease;
    }

    .strength {
      font-size: 12px;
      color: #4b5563;
      margin-top: 4px;
    }

    .err {
      color: #dc2626;
      font-size: 13px;
      min-height: 18px;
    }

    .row-btns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    button {
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-primary {
      border: none;
      background: #0969da;
      color: #ffffff;
    }

    .btn-primary:hover {
      background: #0550ae;
    }

    .btn-secondary {
      border: 1px solid #d1d5db;
      background: #ffffff;
      color: #111827;
    }

    .btn-secondary:hover {
      background: #f9fafb;
    }

    .footer {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      text-align: center;
    }

    .footer-links {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 14px;
      font-size: 13px;
    }

    .footer-links a {
      color: #4b5563;
      text-decoration: none;
    }

    .footer-links a:hover {
      color: #111827;
      text-decoration: underline;
    }

    .copyright {
      font-size: 12px;
      color: #6b7280;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">Sovva</div>
    <h1>Пароль</h1>
    <p>Придумайте пароль для аккаунта, затем перейдём к проверке.</p>

    <div>
      <label for="passInput">Пароль</label>
      <input id="passInput" type="password" autocomplete="new-password" />
      <div class="bar-bg"><div id="barFill" class="bar-fill"></div></div>
      <div id="strengthText" class="strength">Надёжность: —</div>
    </div>

    <div>
      <label for="confirmInput">Повторите пароль</label>
      <input id="confirmInput" type="password" autocomplete="new-password" />
    </div>

    <div id="errMsg" class="err"></div>
    <div class="row-btns">
      <button id="backBtn" type="button" class="btn-secondary">Назад</button>
      <button id="nextBtn" type="button" class="btn-primary">Далее</button>
    </div>
  </main>

  <footer class="footer">
    <nav class="footer-links" aria-label="Footer links">
      <a href="./support.html">Support</a>
      <a href="./terms.html">Terms</a>
      <a href="./privacy.html">Privacy</a>
    </nav>
    <div class="copyright">© 2026 Sovva, All rights reserved</div>
  </footer>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
    import { getAuth } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCzok_zQsToh-OzGUBCK4Omx8IELOU9CC4",
      authDomain: "sovva-e2c64.firebaseapp.com",
      databaseURL: "https://sovva-e2c64-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "sovva-e2c64",
      storageBucket: "sovva-e2c64.firebasestorage.app",
      messagingSenderId: "71366651741",
      appId: "1:71366651741:web:7d26107a41f0291f1f82b4"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const DRAFT_KEY = "sovva_reg_draft";
    const passInput = document.getElementById("passInput");
    const confirmInput = document.getElementById("confirmInput");
    const barFill = document.getElementById("barFill");
    const strengthText = document.getElementById("strengthText");
    const errMsg = document.getElementById("errMsg");
    const backBtn = document.getElementById("backBtn");
    const nextBtn = document.getElementById("nextBtn");

    function loadDraft() {
      try { return JSON.parse(sessionStorage.getItem(DRAFT_KEY) || "{}"); } catch { return {}; }
    }

    function saveDraft(patch) {
      sessionStorage.setItem(DRAFT_KEY, JSON.stringify({ ...loadDraft(), ...patch }));
    }

    async function hashPassword(password) {
      const enc = new TextEncoder().encode(password);
      const buf = await crypto.subtle.digest("SHA-256", enc);
      return Array.from(new Uint8Array(buf)).map((b) => b.toString(16).padStart(2, "0")).join("");
    }

    function updateStrength() {
      const v = passInput.value || "";
      if (!v) {
        barFill.style.width = "0%";
        strengthText.textContent = "Надёжность: —";
        return;
      }
      let score = 0;
      if (v.length >= 6) score++;
      if (v.length >= 10) score++;
      if (/[A-ZА-ЯЁ]/.test(v) && /[a-zа-яё]/.test(v)) score++;
      if (/\d/.test(v) || /[^A-Za-zА-Яа-яЁё0-9]/.test(v)) score++;

      if (score <= 1) {
        barFill.style.width = "30%";
        barFill.style.backgroundColor = "#dc2626";
        strengthText.textContent = "Надёжность: Слабый";
      } else if (score <= 3) {
        barFill.style.width = "68%";
        barFill.style.backgroundColor = "#d97706";
        strengthText.textContent = "Надёжность: Средний";
      } else {
        barFill.style.width = "100%";
        barFill.style.backgroundColor = "#16a34a";
        strengthText.textContent = "Надёжность: Надёжный";
      }
    }

    const draft = loadDraft();
    if (!draft.firstName || !draft.birthDate) {
      window.location.replace("./name.html");
    }

    (async () => {
      await auth.authStateReady();
      if (!auth.currentUser) {
        window.location.replace("./index.html");
      }
    })();

    passInput.addEventListener("input", updateStrength);
    backBtn.addEventListener("click", () => {
      window.location.href = "./otherandgender.html";
    });

    nextBtn.addEventListener("click", async () => {
      const p1 = passInput.value;
      const p2 = confirmInput.value;
      if (!p1 || p1.length < 6) {
        errMsg.textContent = "Пароль должен содержать минимум 6 символов.";
        passInput.focus();
        return;
      }
      if (p1 !== p2) {
        errMsg.textContent = "Пароли не совпадают.";
        confirmInput.focus();
        return;
      }
      errMsg.textContent = "";
      const passwordHash = await hashPassword(p1);
      saveDraft({ passwordHash });
      window.location.href = "./humantesting.html";
    });
  </script>
</body>
</html>
