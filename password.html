<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sovva — Пароль</title>
  <style>
    :root { --bg:#0d1117; --card:#161b22; --text:#f0f6fc; --muted:#8b949e; --border:#30363d; --accent:#2f81f7; --danger:#f85149; --warn:#d29922; --ok:#3fb950; }
    * { box-sizing:border-box; font-family:system-ui,-apple-system,sans-serif; }
    body { margin:0; min-height:100vh; padding:20px; background:var(--bg); color:var(--text); display:flex; justify-content:center; align-items:flex-start; }
    .card { width:100%; max-width:440px; background:var(--card); border:1px solid var(--border); border-radius:16px; padding:20px; display:flex; flex-direction:column; gap:14px; }
    h1 { margin:0; font-size:20px; }
    p { margin:0; font-size:13px; color:var(--muted); line-height:1.45; }
    label { font-size:13px; font-weight:600; color:var(--muted); display:block; margin-bottom:6px; }
    input { width:100%; padding:10px 12px; border-radius:10px; border:1px solid var(--border); background:var(--bg); color:var(--text); font-size:14px; }
    .bar-bg { width:100%; height:6px; border-radius:999px; background:#21262d; overflow:hidden; margin-top:6px; }
    .bar-fill { width:0%; height:100%; background:var(--danger); transition:width .2s ease, background-color .2s ease; }
    .strength { font-size:12px; color:var(--muted); margin-top:4px; }
    .err { color:var(--danger); font-size:13px; min-height:18px; }
    .row-btns { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    button { padding:11px 14px; border-radius:10px; font-size:14px; font-weight:600; cursor:pointer; }
    .btn-primary { border:none; background:var(--accent); color:#fff; }
    .btn-secondary { border:1px solid var(--border); background:transparent; color:var(--text); }
  </style>
</head>
<body>
  <main class="card">
    <h1>Пароль</h1>
    <p>Придумайте пароль для аккаунта, затем перейдём к проверке.</p>

    <div>
      <label for="passInput">Пароль</label>
      <input id="passInput" type="password" autocomplete="new-password" />
      <div class="bar-bg"><div id="barFill" class="bar-fill"></div></div>
      <div id="strengthText" class="strength">Надёжность: —</div>
    </div>

    <div>
      <label for="confirmInput">Повторите пароль</label>
      <input id="confirmInput" type="password" autocomplete="new-password" />
    </div>

    <div id="errMsg" class="err"></div>
    <div class="row-btns">
      <button id="backBtn" type="button" class="btn-secondary">Назад</button>
      <button id="nextBtn" type="button" class="btn-primary">Далее</button>
    </div>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCzok_zQsToh-OzGUBCK4Omx8IELOU9CC4",
      authDomain: "sovva-e2c64.firebaseapp.com",
      databaseURL: "https://sovva-e2c64-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "sovva-e2c64",
      storageBucket: "sovva-e2c64.firebasestorage.app",
      messagingSenderId: "71366651741",
      appId: "1:71366651741:web:7d26107a41f0291f1f82b4"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const DRAFT_KEY = "sovva_reg_draft";
    const passInput = document.getElementById("passInput");
    const confirmInput = document.getElementById("confirmInput");
    const barFill = document.getElementById("barFill");
    const strengthText = document.getElementById("strengthText");
    const errMsg = document.getElementById("errMsg");
    const backBtn = document.getElementById("backBtn");
    const nextBtn = document.getElementById("nextBtn");

    function loadDraft() {
      try { return JSON.parse(sessionStorage.getItem(DRAFT_KEY) || "{}"); } catch { return {}; }
    }

    function saveDraft(patch) {
      sessionStorage.setItem(DRAFT_KEY, JSON.stringify({ ...loadDraft(), ...patch }));
    }

    async function hashPassword(password) {
      const enc = new TextEncoder().encode(password);
      const buf = await crypto.subtle.digest("SHA-256", enc);
      return Array.from(new Uint8Array(buf)).map((b) => b.toString(16).padStart(2, "0")).join("");
    }

    function updateStrength() {
      const v = passInput.value || "";
      if (!v) {
        barFill.style.width = "0%";
        strengthText.textContent = "Надёжность: —";
        return;
      }
      let score = 0;
      if (v.length >= 6) score++;
      if (v.length >= 10) score++;
      if (/[A-ZА-ЯЁ]/.test(v) && /[a-zа-яё]/.test(v)) score++;
      if (/\d/.test(v) || /[^A-Za-zА-Яа-яЁё0-9]/.test(v)) score++;

      if (score <= 1) {
        barFill.style.width = "30%";
        barFill.style.backgroundColor = "var(--danger)";
        strengthText.textContent = "Надёжность: Слабый";
      } else if (score <= 3) {
        barFill.style.width = "68%";
        barFill.style.backgroundColor = "var(--warn)";
        strengthText.textContent = "Надёжность: Средний";
      } else {
        barFill.style.width = "100%";
        barFill.style.backgroundColor = "var(--ok)";
        strengthText.textContent = "Надёжность: Надёжный";
      }
    }

    const draft = loadDraft();
    if (!draft.firstName || !draft.birthDate) {
      window.location.replace("./name.html");
    }

    onAuthStateChanged(auth, (user) => {
      if (!user) window.location.replace("./index.html");
    });

    passInput.addEventListener("input", updateStrength);
    backBtn.addEventListener("click", () => {
      window.location.href = "./otherandgender.html";
    });

    nextBtn.addEventListener("click", async () => {
      const p1 = passInput.value;
      const p2 = confirmInput.value;
      if (!p1 || p1.length < 6) {
        errMsg.textContent = "Пароль должен содержать минимум 6 символов.";
        passInput.focus();
        return;
      }
      if (p1 !== p2) {
        errMsg.textContent = "Пароли не совпадают.";
        confirmInput.focus();
        return;
      }
      errMsg.textContent = "";
      const passwordHash = await hashPassword(p1);
      saveDraft({ passwordHash });
      window.location.href = "./humantesting.html";
    });
  </script>
</body>
</html>
