<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />
  <title>Sovva — Профиль</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f6f8fa;
      --card: #ffffff;
      --text: #111827;
      --muted: #57606a;
      --border: #d0d7de;
      --input-bg: #ffffff;
      --btn-bg: #111827;
      --btn-text: #ffffff;
      --accent: #374151;
      --ok: #1a7f37;
      --sheet-bg: #ffffff;
      --backdrop: rgba(0, 0, 0, 0.45);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117;
        --card: #161b22;
        --text: #f0f6fc;
        --muted: #8b949e;
        --border: #30363d;
        --input-bg: #0d1117;
        --btn-bg: #f0f6fc;
        --btn-text: #0d1117;
        --accent: #c9d1d9;
        --ok: #3fb950;
        --sheet-bg: #161b22;
        --backdrop: rgba(0, 0, 0, 0.65);
      }
    }
    * { box-sizing: border-box; }
    body, input, select, button {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }
    body {
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }
    .card {
      width: 100%;
      max-width: 480px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .profile-header {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .avatar {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid var(--border);
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: 700;
      flex-shrink: 0;
    }
    .nickname { font-size: 20px; font-weight: 700; margin: 0; }
    .lastname { font-size: 14px; color: var(--muted); margin-top: 2px; }
    .section {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
    }
    .section-title { font-size: 15px; font-weight: 600; margin: 0; }
    .input {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--input-bg);
      color: var(--text);
      font-size: 14px;
    }
    .btn {
      width: 100%;
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-primary { background: var(--btn-bg); color: var(--btn-text); border-color: var(--btn-bg); }
    .btn-secondary { background: transparent; color: var(--text); }
    .btn-action { background: var(--accent); color: var(--bg); border-color: var(--accent); }
    .msg-ok { font-size: 13px; color: var(--ok); min-height: 18px; }
    .msg-err { font-size: 13px; color: var(--text); min-height: 18px; }

    /* Нижнее окно (Bottom Sheet) со свайпом вниз */
    .sheet-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: var(--backdrop);
      z-index: 100;
      align-items: flex-end;
      justify-content: center;
      transition: background-color 0.2s ease;
    }
    .sheet-backdrop.open { display: flex; }
    .sheet {
      width: 100%;
      max-width: 540px;
      background: var(--sheet-bg);
      border: 1px solid var(--border);
      border-bottom: none;
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
      padding: 14px 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 -8px 30px rgba(0, 0, 0, 0.25);
      transform: translateY(0);
      transition: transform 0.22s ease;
      touch-action: none;
    }
    .sheet.dragging {
      transition: none;
    }
    .sheet-drag-zone {
      padding: 4px 0 6px;
      cursor: grab;
      display: flex;
      justify-content: center;
    }
    .sheet-handle {
      width: 42px;
      height: 5px;
      border-radius: 999px;
      background: var(--border);
    }
    .sheet-title {
      margin: 0;
      font-size: 17px;
      font-weight: 700;
      color: var(--text);
    }
    .sheet-title.ok { color: var(--ok); }
    .sheet-list {
      margin: 0;
      padding-left: 18px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 14px;
    }
    .sheet-note {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.4;
      margin: 0;
    }
    .sheet-actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="profile-header">
      <img id="avatarImg" class="avatar" src="" alt="" style="display:none;" />
      <div id="avatarFallback" class="avatar">S</div>
      <div>
        <h1 id="nicknameText" class="nickname">Профиль</h1>
        <div id="lastNameText" class="lastname"></div>
      </div>
    </div>

    <div class="section">
      <h2 id="passwordSectionTitle" class="section-title">Установить или изменить пароль</h2>
      <input id="newPasswordInput" class="input" type="password" autocomplete="new-password" placeholder="Новый пароль" />
      <input id="confirmNewPasswordInput" class="input" type="password" autocomplete="new-password" placeholder="Повторите новый пароль" />
      <button id="savePasswordBtn" class="btn btn-primary" type="button">Сохранить пароль</button>
      <div id="statusOk" class="msg-ok"></div>
      <div id="statusErr" class="msg-err"></div>
    </div>

    <div class="section">
      <button id="logoutBtn" class="btn btn-secondary" type="button">Выйти из аккаунта</button>
      <button id="deleteAccountBtn" class="btn btn-secondary" type="button">Удалить аккаунт</button>
    </div>
  </div>

  <!-- Нижнее окно тревоги / завершения сеанса -->
  <div id="securitySheetBackdrop" class="sheet-backdrop" role="dialog" aria-modal="true">
    <div id="securitySheet" class="sheet">
      <div class="sheet-drag-zone" aria-hidden="true">
        <div class="sheet-handle"></div>
      </div>

      <h2 id="sheetTitle" class="sheet-title">В ваш аккаунт вошло подозрительное устройство</h2>

      <ul id="suspiciousDetailsList" class="sheet-list">
        <li id="detailDeviceLine">Android/iOS: определение устройства...</li>
        <li id="detailIpLine">IP: определяется...</li>
        <li id="detailRegionLine">Регион: определяется...</li>
      </ul>
      <p class="sheet-note">Из-за ВПН Регион и IP адрес показывается неточно</p>
      <p id="sheetWarningText" style="margin:0; font-size:14px; font-weight:500;">
        Если это были не вы, немедленно завершите сеанс
      </p>

      <div id="alertActions" class="sheet-actions">
        <button id="endSuspiciousSessionBtn" class="btn btn-action" type="button">Завершить сеанс</button>
      </div>

      <div id="postTerminateActions" class="sheet-actions" style="display:none;">
        <button id="passwordActionBtn" class="btn btn-primary" type="button">Поставить пароль</button>
        <button id="okSheetBtn" class="btn btn-secondary" type="button">ОК</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";
    import {
      getDatabase,
      ref,
      get,
      set,
      update,
      remove,
      onValue,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCzok_zQsToh-OzGUBCK4Omx8IELOU9CC4",
      authDomain: "sovva-e2c64.firebaseapp.com",
      databaseURL: "https://sovva-e2c64-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "sovva-e2c64",
      storageBucket: "sovva-e2c64.firebasestorage.app",
      messagingSenderId: "71366651741",
      appId: "1:71366651741:web:7d26107a41f0291f1f82b4"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    const PART_MODELS = {
      "25028RN03A": "Xiaomi Redmi 14C / A-series (25028RN03A)",
      "MWF43LL/A": "iPhone 15 Pro (MWF43LL/A)",
      "MTUX3LL/A": "iPhone 15 (MTUX3LL/A)",
      "MQ0G3LL/A": "iPhone 14 Pro (MQ0G3LL/A)",
      "MPVN3LL/A": "iPhone 14 (MPVN3LL/A)",
      "MNWC3LL/A": "iPhone 13 (MNWC3LL/A)"
    };

    const avatarImg = document.getElementById("avatarImg");
    const avatarFallback = document.getElementById("avatarFallback");
    const nicknameText = document.getElementById("nicknameText");
    const lastNameText = document.getElementById("lastNameText");
    const passwordSectionTitle = document.getElementById("passwordSectionTitle");
    const newPasswordInput = document.getElementById("newPasswordInput");
    const confirmNewPasswordInput = document.getElementById("confirmNewPasswordInput");
    const savePasswordBtn = document.getElementById("savePasswordBtn");
    const logoutBtn = document.getElementById("logoutBtn");
    const deleteAccountBtn = document.getElementById("deleteAccountBtn");
    const statusOk = document.getElementById("statusOk");
    const statusErr = document.getElementById("statusErr");

    const sheetBackdrop = document.getElementById("securitySheetBackdrop");
    const sheet = document.getElementById("securitySheet");
    const sheetTitle = document.getElementById("sheetTitle");
    const suspiciousDetailsList = document.getElementById("suspiciousDetailsList");
    const detailDeviceLine = document.getElementById("detailDeviceLine");
    const detailIpLine = document.getElementById("detailIpLine");
    const detailRegionLine = document.getElementById("detailRegionLine");
    const sheetWarningText = document.getElementById("sheetWarningText");
    const alertActions = document.getElementById("alertActions");
    const postTerminateActions = document.getElementById("postTerminateActions");
    const endSuspiciousSessionBtn = document.getElementById("endSuspiciousSessionBtn");
    const passwordActionBtn = document.getElementById("passwordActionBtn");
    const okSheetBtn = document.getElementById("okSheetBtn");

    let currentUser = null;
    let userHasPassword = false;
    let foreignSessionId = null;
    let unsubActiveSession = null;
    let unsubSessions = null;

    const sessionId = sessionStorage.getItem("sovva_session_id") ||
      ("sess_" + Math.random().toString(36).slice(2, 10) + "_" + Date.now().toString(36));
    sessionStorage.setItem("sovva_session_id", sessionId);

    function renderProfileUI({ firstName, lastName, photo, hasPassword }) {
      const nick = firstName || "Пользователь";
      nicknameText.textContent = nick;
      lastNameText.textContent = lastName || "";
      userHasPassword = Boolean(hasPassword);
      passwordSectionTitle.textContent = userHasPassword ? "Изменить пароль" : "Установить пароль";

      if (photo) {
        avatarImg.src = photo;
        avatarImg.style.display = "block";
        avatarFallback.style.display = "none";
      } else {
        avatarImg.style.display = "none";
        avatarFallback.style.display = "flex";
        avatarFallback.textContent = nick.charAt(0).toUpperCase() || "S";
      }
    }

    // Мгновенный показ из кэша ещё до ответа Firebase
    try {
      const cached = JSON.parse(sessionStorage.getItem("sovva_profile_cache") || "null");
      if (cached) renderProfileUI(cached);
    } catch (_) {}

    function resetSheetPosition() {
      sheet.classList.remove("dragging");
      sheet.style.transform = "translateY(0px)";
      sheetBackdrop.style.backgroundColor = "";
    }

    function openSheet() {
      resetSheetPosition();
      sheetBackdrop.classList.add("open");
    }

    function closeSheet() {
      sheet.classList.remove("dragging");
      sheet.style.transform = "translateY(100%)";
      sheetBackdrop.style.backgroundColor = "transparent";
      setTimeout(() => {
        sheetBackdrop.classList.remove("open");
        resetSheetPosition();
      }, 200);
    }

    let startY = 0;
    let currentDeltaY = 0;
    let isDragging = false;

    sheet.addEventListener("touchstart", (e) => {
      if (e.target.closest("button, input")) return;
      startY = e.touches[0].clientY;
      currentDeltaY = 0;
      isDragging = true;
      sheet.classList.add("dragging");
    }, { passive: true });

    sheet.addEventListener("touchmove", (e) => {
      if (!isDragging) return;
      const dy = e.touches[0].clientY - startY;
      currentDeltaY = dy > 0 ? dy : 0;
      sheet.style.transform = `translateY(${currentDeltaY}px)`;
      const fade = Math.max(0, 1 - currentDeltaY / 260);
      sheetBackdrop.style.backgroundColor = `rgba(0, 0, 0, ${(0.5 * fade).toFixed(2)})`;
    }, { passive: true });

    sheet.addEventListener("touchend", () => {
      if (!isDragging) return;
      isDragging = false;
      sheet.classList.remove("dragging");
      if (currentDeltaY > 90) {
        closeSheet();
      } else {
        resetSheetPosition();
      }
    });

    function detectDeviceLabel() {
      const ua = navigator.userAgent || "";
      const savedPart = localStorage.getItem("sovva_device_part") || "";
      const partMatch = savedPart.trim().toUpperCase() ||
        (ua.match(/\b(25028RN03A|M[A-Z0-9]{4,7}\/[A-Z]{1,2})\b/i)?.[1]?.toUpperCase() || "");

      const isIOS = /iPhone|iPad|iPod/i.test(ua);
      const isAndroid = /Android/i.test(ua);
      const osName = isIOS ? "iOS" : isAndroid ? "Android" : "Web/Desktop";

      if (partMatch) {
        const modelName = PART_MODELS[partMatch] || (isIOS ? `iPhone (${partMatch})` : `Android (${partMatch})`);
        return `${osName} (${partMatch} — ${modelName})`;
      }
      return `${osName} (${ua.slice(0, 60) || "Устройство"})`;
    }

    async function fetchNetworkInfo() {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 1500);
      try {
        const res = await fetch("https://ipwho.is/", { cache: "no-store", signal: controller.signal });
        const data = await res.json();
        clearTimeout(timer);
        if (data && data.success !== false) {
          return {
            ip: data.ip || "Не определён",
            region: [data.city, data.region, data.country].filter(Boolean).join(", ") || "Не определён"
          };
        }
      } catch (_) {
        clearTimeout(timer);
      }
      return { ip: "Не определён", region: "Не определён" };
    }

    async function registerCurrentSession(uid) {
      const deviceLabel = detectDeviceLabel();
      await set(ref(db, `sessions/${uid}/${sessionId}`), {
        sessionId,
        device: deviceLabel,
        ip: "Определяется...",
        region: "Определяется...",
        updatedAt: serverTimestamp()
      });
      await update(ref(db, `users/${uid}`), {
        activeSessionId: sessionId
      });

      const net = await fetchNetworkInfo();
      await update(ref(db, `sessions/${uid}/${sessionId}`), {
        ip: net.ip,
        region: net.region,
        updatedAt: serverTimestamp()
      }).catch(() => {});
    }

    function openSecuritySheet(remoteSession) {
      foreignSessionId = remoteSession?.sessionId || null;
      sheetTitle.textContent = "В ваш аккаунт вошло подозрительное устройство";
      sheetTitle.classList.remove("ok");
      suspiciousDetailsList.style.display = "flex";
      detailDeviceLine.textContent = `Android/iOS: ${remoteSession?.device || "Неизвестное устройство"}`;
      detailIpLine.textContent = `IP: ${remoteSession?.ip || "Не определён"}`;
      detailRegionLine.textContent = `Регион: ${remoteSession?.region || "Не определён"}`;

      sheetWarningText.textContent = "Если это были не вы, немедленно завершите сеанс";
      alertActions.style.display = "flex";
      postTerminateActions.style.display = "none";
      openSheet();
    }

    function showSessionTerminatedState() {
      sheetTitle.textContent = "Сеанс устройства этого аккаунта успешно завершен";
      sheetTitle.classList.add("ok");
      suspiciousDetailsList.style.display = "none";
      sheetWarningText.textContent = userHasPassword
        ? "Для вашей безопасности аккаунта, рекомендуем сменить пароль"
        : "Для вашей безопасности аккаунта, рекомендуем поставить пароль";
      passwordActionBtn.textContent = userHasPassword ? "Сменить пароль" : "Поставить пароль";
      alertActions.style.display = "none";
      postTerminateActions.style.display = "flex";
      openSheet();
    }

    endSuspiciousSessionBtn.addEventListener("click", async () => {
      if (!currentUser) return;
      if (foreignSessionId) {
        await remove(ref(db, `sessions/${currentUser.uid}/${foreignSessionId}`)).catch(() => {});
      }
      await update(ref(db, `users/${currentUser.uid}`), {
        activeSessionId: sessionId
      }).catch(() => {});
      showSessionTerminatedState();
    });

    passwordActionBtn.addEventListener("click", () => {
      closeSheet();
      newPasswordInput.focus();
      newPasswordInput.scrollIntoView({ behavior: "smooth", block: "center" });
    });

    okSheetBtn.addEventListener("click", closeSheet);

    async function hashPassword(pw) {
      const encoder = new TextEncoder();
      const data = encoder.encode(pw);
      const hashBuffer = await crypto.subtle.digest("SHA-256", data);
      return Array.from(new Uint8Array(hashBuffer))
        .map((b) => b.toString(16).padStart(2, "0"))
        .join("");
    }

    onAuthStateChanged(auth, async (user) => {
      if (unsubActiveSession) unsubActiveSession();
      if (unsubSessions) unsubSessions();

      if (!user) {
        sessionStorage.removeItem("sovva_profile_cache");
        window.location.replace("./index.html");
        return;
      }
      currentUser = user;

      // Сразу рисуем данные из Auth без ожидания RTDB
      renderProfileUI({
        firstName: user.displayName || "Пользователь",
        lastName: "",
        photo: user.photoURL || "",
        hasPassword: false
      });

      const snap = await get(ref(db, "users/" + user.uid));
      const profile = snap.exists() ? snap.val() : null;

      if (!profile || profile.registrationCompleted !== true) {
        window.location.replace("./auth.html");
        return;
      }

      const uiData = {
        firstName: profile.firstName || user.displayName || "Пользователь",
        lastName: profile.lastName || "",
        photo: profile.photo || user.photoURL || "",
        hasPassword: Boolean(profile.hasPassword)
      };
      sessionStorage.setItem("sovva_profile_cache", JSON.stringify(uiData));
      renderProfileUI(uiData);

      // Регистрацию сеанса запускаем в фоне, не блокируя интерфейс
      registerCurrentSession(user.uid).catch(() => {});

      unsubSessions = onValue(ref(db, `sessions/${user.uid}`), async (sSnap) => {
        const latestSessionsMap = sSnap.exists() ? sSnap.val() : {};
        const curActiveSnap = await get(ref(db, `users/${user.uid}/activeSessionId`));
        const activeId = curActiveSnap.exists() ? curActiveSnap.val() : null;
        if (activeId && activeId !== sessionId && !latestSessionsMap[sessionId]) {
          await signOut(auth);
          window.location.replace("./index.html");
        }
      });

            unsubActiveSession = onValue(ref(db, `users/${user.uid}/activeSessionId`), async (aSnap) => {
        const activeId = aSnap.exists() ? aSnap.val() : null;
        if (!activeId || activeId === sessionId) return;

        const sessSnap = await get(ref(db, `sessions/${user.uid}/${activeId}`));
        const remoteInfo = sessSnap.exists() ? sessSnap.val() : { sessionId: activeId };
        openSecuritySheet(remoteInfo);
      });
    });

    savePasswordBtn.addEventListener("click", async () => {
      statusOk.textContent = "";
      statusErr.textContent = "";

      const pw = newPasswordInput.value;
      const pw2 = confirmNewPasswordInput.value;

      if (!pw) {
        statusErr.textContent = "Введите пароль.";
        return;
      }
      if (pw !== pw2) {
        statusErr.textContent = "Пароли не совпадают.";
        return;
      }

      try {
        const hash = await hashPassword(pw);
        await update(ref(db, "users/" + currentUser.uid), {
          hasPassword: true,
          passwordHash: hash,
          updatedAt: serverTimestamp()
        });
        userHasPassword = true;
        newPasswordInput.value = "";
        confirmNewPasswordInput.value = "";
        passwordSectionTitle.textContent = "Изменить пароль";
        statusOk.textContent = "Пароль сохранён в облаке.";
      } catch (err) {
        statusErr.textContent = "Ошибка: " + (err.code || err.message);
      }
    });

    logoutBtn.addEventListener("click", async () => {
      sessionStorage.removeItem("sovva_profile_cache");
      if (currentUser) {
        await remove(ref(db, `sessions/${currentUser.uid}/${sessionId}`)).catch(() => {});
        await remove(ref(db, "online/" + currentUser.uid)).catch(() => {});
      }
      await signOut(auth);
      window.location.replace("./index.html");
    });

    deleteAccountBtn.addEventListener("click", () => {
      window.location.href = "./deleteaccount.html";
    });
  </script>
</body>
</html>
